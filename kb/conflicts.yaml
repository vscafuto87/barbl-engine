conflicts:
- id: C-TRIAL-1RM
  status: resolved
  date: '2026-10-30'
  between:
  - P-1RM-ESTIMATE-RANGE
  - parameters/trialLoad
  summary:
    it: Helms e Reynolds indicano che la stima del massimale peggiora oltre le 5-10 ripetizioni; la regola
      14 fa la serie di prova alle ripetizioni del target.
  resolution:
    it: 'Conflitto solo apparente: la prova converte su 1-3 ripetizioni e l''errore della formula si annulla
      quasi del tutto. Il rischio vero è il RIR dichiarato (P-RIR-ACCURACY): rirRepeat portato da 5 a
      4 e vincolo del motore maxRepsPlusRir = 10. Decisione di Vincenzo, pull request barbl#31.'
- id: C-RULE8-FRACTIONAL
  status: deferred
  date: '2026-10-30'
  between:
  - P-VOL-FRACTIONAL
  - regola 8 dell'app (solo muscolo primario)
  summary:
    it: Pelland trova che contare le serie indirette come mezze serie prevede meglio i risultati; la regola
      8 dell'app conta solo il muscolo primario.
  resolution:
    it: 'Decisione di Vincenzo: il motore usa subito i pesi (vocab/muscles.yaml, setWeights); la regola
      8 e il contratto cambieranno in un secondo momento.'
- id: C-RIR-BY-ROLE
  status: resolved
  date: '2026-10-30'
  between:
  - P-RIR-HYP
  - P-FAILURE-NOT-REQUIRED
  summary:
    it: Robinson suggerisce che il cedimento conti di più con carichi leggeri; ACSM dice che non ci sono
      prove per fissare RIR esatti.
  resolution:
    it: 'Chiuso da Vincenzo il 5 novembre 2026: nessuna modifica. Un RIR diverso per tipo di esercizio non ha una fonte di livello alto (ACSM, tier 1, dice che non ci sono prove per RIR esatti; Robinson 2024 da solo non basta).'
- id: C-CALVES-BAND
  status: resolved
  date: '2026-10-30'
  between:
  - templates/upper_lower_4d
  - templates/ppl_ul_5d
  - P-VOL-MIN-10
  summary:
    it: Nel template a 4 giorni i polpacci hanno un solo esercizio da 3 serie a settimana, sotto le 10 del
      principio; in quello a 5 giorni due esercizi da 3 serie (6), perché con sedute di al massimo 15 serie
      non c'è spazio per un terzo e un quarto.
  resolution:
    it: 'Chiuso da Vincenzo il 5 novembre 2026: secondo esercizio per i polpacci nella seconda seduta di gambe del template a 4 giorni (6 serie a settimana, come a 5 giorni) ed eccezione dichiarata sotto le 10 serie: la soglia di P-VOL-MIN-10 vale per i muscoli grandi.'
- id: C-REST-STRENGTH
  status: resolved
  date: '2026-11-04'
  between:
  - P-REST-NEUTRAL
  - P-REST-LONG-COMPOUND
  - P-REST-MAIN-STR
  summary:
    it: Per la forza ACSM (tier 1) non trova differenze tra recuperi sotto e sopra un minuto; Helms e Schoenfeld
      (tier 4) consigliano almeno 2-3 minuti sui multiarticolari pesanti perché il carico si mantenga tra
      le serie, e la prescrizione strength usa 3-4 minuti sull'esercizio principale. La revisione sistematica di Grgic 2018
      (tier 2, solo abstract) concilia le due letture. Per la forza bastano 60-120 secondi a chi non è allenato,
      mentre chi è allenato ha bisogno di più di 2 minuti.
  resolution:
    it: 'Chiuso da Vincenzo il 5 novembre 2026: si mantengono i recuperi lunghi sui multiarticolari pesanti (3-4 minuti sul principale). La revisione di Grgic 2018 (abstract riletto, testo completo non disponibile) li concilia con l''ACSM: per chi è allenato servono più di 2 minuti. Costo accettato: tempo per serie più alto e taglio delle sedute di forza a 60 minuti.'
- id: C-STRENGTH-VOLUME
  status: resolved
  date: '2026-11-04'
  between:
  - P-VOL-DOSE-STR
  - P-STRENGTH-REP-ZONE
  - templates/upper_lower_4d
  - templates/full_body_3d
  summary:
    it: Per la forza Pelland non trova un guadagno chiaro oltre circa 5 serie frazionarie a settimana, mentre
      i template, nati per la massa, danno 9-13 serie frazionarie ai muscoli principali; inoltre con 3 serie
      sul principale petto, dorso e quadricipiti scendono a 9, sotto bandMin di parameters/belowBand (fascia
      dell'ipertrofia); e con molti complementari la quota di serie da 1-6 ripetizioni resta intorno alla
      metà, sotto i due terzi-tre quarti di Helms.
  resolution:
    it: 'Chiuso da Vincenzo il 5 novembre 2026: la forza usa gli stessi template della massa con la prescrizione strength. Il volume in più rispetto a P-VOL-DOSE-STR è accettato (scelta di design) e la fascia di belowBand non è un obiettivo della forza. Template propri per la forza: solo se il coach li chiede.'
- id: C-LOAD-RATIO-EXERCISES
  status: deferred
  date: '2026-11-05'
  between:
  - P-KNOWN-LOAD-RIR
  summary:
    it: Per i sostituti (e per le alternative) non esiste un rapporto di carico tra esercizi con una fonte
      attendibile. Uno studio su 56 uomini lega il massimale con manubri a quello con bilanciere con una
      regressione (pendenza circa 0,7, errore medio circa 6,5 kg), non con un rapporto fisso; gli altri
      valori che circolano non hanno fonte.
  resolution:
    it: 'Nessuna conversione: i carichi delle alternative restano a mano (`manual`), o con la serie di
      prova dove l''app la prevede. Da rivalutare se esce una fonte di livello 1-3.'
- id: C-TIME-VOLUME
  status: resolved
  date: '2026-11-05'
  between:
  - P-TIME-TRIM
  - P-VOL-MIN-10
  - P-TIME-PER-SET
  summary:
    it: Con 45 minuti a 3 e 4 giorni (e 60 minuti per la forza) le sedute dei template non ci stanno, e il
      motore toglie prima gli isolamenti e poi i complementari. Così braccia e altri muscoli finiscono
      sotto le 10 serie frazionarie settimanali di P-VOL-MIN-10. Il tempo per serie (3 minuti) è provvisorio.
  resolution:
    it: 'Chiuso da Vincenzo il 5 novembre 2026: con sedute corte si toglie prima l''isolamento poi i complementari (P-TIME-TRIM), meglio di rifiutare il profilo. L''app segnala il volume sotto fascia e suggerisce di allungare la durata. Il tempo per serie resta provvisorio.'
- id: C-SEX-FATIGUE
  status: open
  date: '2026-11-05'
  between:
  - P-SEX-RESPONSE
  - nuckols-2026-sex-fatigue
  summary:
    it: Nuckols 2026 trova che le donne allenate completano molte più ripetizioni in serie ravvicinate
      perché recuperano di più tra una serie e l'altra, mentre il recupero nei giorni successivi è uguale;
      alcuni autori della KB (Israetel, Nippard) ne traggono più ripetizioni o volume per le donne.
  resolution:
    it: 'Aperto: una sola prova sperimentale, sulla panca. Il motore resta con le stesse regole per tutti
      (P-SEX-RESPONSE); da rivedere con il coach e con nuovi studi prima di qualsiasi parametro per sesso.'
