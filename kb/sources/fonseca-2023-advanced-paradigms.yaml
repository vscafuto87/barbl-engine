readNote: Letti l'abstract e le sezioni disponibili su PMC, non tutto il testo (dati verificati su Crossref il 16/11/2026). Dieci RCT in soggetti allenati; nessun vantaggio dei metodi avanzati (drop set, rest-pause e altri) sull'ipertrofia; i drop set degli studi riducono il carico del 20-30% circa. Nessuno studio sui superset né sui myo-reps.
