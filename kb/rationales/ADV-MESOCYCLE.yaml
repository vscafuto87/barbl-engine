text:
  it: 'Settimana {week} di {totalWeeks}: RIR target {rir}. Mesociclo avanzato: si parte a 2, si arriva
    a 0 nell''ultima settimana di carico e dalla settimana 3 l''ultima serie degli isolamenti va a cedimento.
    I multiarticolari pesanti restano ad almeno 1. Poi lo scarico.'
  en: 'Week {week} of {totalWeeks}: target {rir} RIR. Advanced mesocycle: you start at 2, reach 0 in the
