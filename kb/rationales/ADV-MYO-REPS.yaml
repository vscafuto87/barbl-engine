ruleId: ADV-MYO-REPS
key: advanced.myoReps
level: set
text:
  it: 'Myo-reps sull''ultima serie: la porti al cedimento, poi fai mini-serie da poche ripetizioni con lo stesso carico e pochi secondi di pausa, finché le ripetizioni non calano troppo. Accumuli ripetizioni vicino al limite in poco tempo. Vale nelle ultime settimane di carico, mai nello scarico, e solo sugli esercizi di isolamento.'
  en: 'Myo-reps on the last set: take it to failure, then do mini-sets of a few reps with the same load and a few seconds of rest, until your reps drop too far. You pile up reps close to your limit in little time. It applies in the last loading weeks, never in the deload, and only on isolation exercises.'
principles:
- P-MYO-REPS
- P-ADV-STRUCTURE
