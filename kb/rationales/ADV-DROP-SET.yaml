ruleId: ADV-DROP-SET
key: advanced.dropSet
level: set
text:
  it: 'Drop set sull''ultima serie: arrivi al cedimento, togli circa un quarto del carico e continui subito
    fino a un nuovo cedimento. Fa crescere quanto le serie normali in meno tempo e rende la seduta più dura.
    Vale dalla settimana 3, mai nello scarico.'
  en: 'Drop set on the last set: reach failure, remove about a quarter of the load and keep going right
    away to a new failure. It builds muscle as well as normal sets in less time and makes the session harder.
    It applies from week 3, never in the deload.'
principles:
- P-DROP-SET
- P-ADV-STRUCTURE
