id: P-SUPERSET-ANTAGONIST
topic: structure
statement:
  it: 'Un superset tra muscoli diversi (antagonisti, come bicipiti e tricipiti, o non collegati) accorcia
    la seduta senza perdere ripetizioni né volume; due esercizi per lo stesso muscolo invece riducono il
    volume. Barbl mette in superset solo esercizi di isolamento o complementari, mai i multiarticolari pesanti,
    con circa un minuto e mezzo tra un giro e l''altro.'
  en: 'A superset between different muscles (antagonists, like biceps and triceps, or unrelated ones) shortens
    the session without losing reps or volume; two exercises for the same muscle instead reduce volume. Barbl
    only pairs isolation or accessory exercises, never heavy compound lifts, with about a minute and a half
    between rounds.'
evidence: medium
