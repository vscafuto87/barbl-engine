id: P-TIME-TECHNIQUE
topic: structure
statement:
  it: 'Una tecnica dell''ultima serie allunga la seduta: un drop set o un blocco di myo-reps costano circa
    un minuto in più della serie normale, perché si cambia il carico o si fanno pause di pochi secondi. Valore
    di Barbl, stimato dai tempi descritti dalle fonti.'
  en: 'A last-set technique makes the session longer: a drop set or a myo-reps block costs about one minute
    more than a normal set, because you change the load or take rests of a few seconds. Barbl value, estimated
    from the times described by the sources.'
