id: P-EXERCISE-VARIATION
topic: structure
statement:
  it: 'Per gli esercizi di isolamento, tra più scelte equivalenti per attrezzo e muscolo se ne assegna una
    sola per tutto il mesociclo. La variazione sistematica e pianificata può servire (soprattutto per
    le diverse regioni del muscolo), mentre ruotare gli esercizi a caso da una seduta all''altra non dà
    vantaggi e può ostacolare la progressione. Il piano quindi non cambia da una settimana all''altra:
    la varietà sta tra un piano e l''altro, scelta una volta sola.'
  en: 'For isolation exercises, one of several equivalent choices (same muscle, different equipment) is
    assigned and kept for the whole mesocycle. Systematic, planned variation may help (especially for
    different muscle regions), while rotating exercises at random from session to session shows no benefit
    and may hinder progression. The plan therefore does not change week to week: variety lies between
    plans, picked once.'
evidence: low
status: provisional
