id: P-PERIODIZATION-NEUTRAL
topic: progression
statement:
  it: 'Con un sovraccarico progressivo e a volume pari, la periodizzazione non dà più ipertrofia di un
    programma non periodizzato e i modelli lineare e ondulato si equivalgono; per la forza c''è un
    piccolo vantaggio a favore della periodizzazione. Il mesociclo resta una scelta di organizzazione.'
  en: 'With progressive overload and equal volume, periodization gives no more hypertrophy than a
    non-periodized program and linear and undulating models are equivalent; for strength there is a
    small advantage for periodization. The mesocycle remains an organizational choice.'
evidence: medium
status: provisional
