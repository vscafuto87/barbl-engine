id: P-REST-NEUTRAL
topic: recovery
statement:
  it: 'Per la forza, recuperi sotto o sopra un minuto danno risultati simili. Per l''ipertrofia una
    meta-analisi bayesiana del 2024 vede un piccolo vantaggio, incerto, per le pause oltre i 60 secondi
    e nessuna differenza oltre i 90 circa: i recuperi della KB, tutti da 90 secondi in su, stanno già
    in questa zona.'
  en: 'For strength, rests under or over one minute give similar results. For hypertrophy a 2024 Bayesian
    meta-analysis sees a small, uncertain advantage for rests longer than 60 seconds and no difference
    beyond about 90: the rests in the KB, all 90 seconds or more, already sit in this range.'
evidence: medium
status: provisional
reviewedBy: null
