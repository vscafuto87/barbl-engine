id: P-RECOVERY-48H
topic: recovery
statement:
  it: Gli arti inferiori recuperano in 48-72 ore, i superiori in 24 o meno. Una seduta Full body, che
    comprende lavoro per le gambe, usa il recupero più lungo (48 ore).
  en: Lower-body muscles recover in 48-72 hours, upper-body in 24 or less. A full-body session, which
    includes leg work, uses the longer recovery (48 hours).
