id: P-ADV-FAILURE-LAST-SET
topic: intensity
statement:
  it: Per chi si allena da anni il cedimento ha senso se è selettivo, cioè solo sull'ultima serie di un
    esercizio, con più libertà sugli esercizi di isolamento e con prudenza sui multiarticolari pesanti,
    che affaticano tutto il corpo. Il cedimento non dà più ipertrofia del fermarsi vicino (Refalo 2023),
    ma la crescita aumenta man mano che ci si avvicina (Robinson 2024); è una scelta per chi vuole sedute
    più dure, non un requisito. Restano esclusi anche gli esercizi rischiosi vicino al cedimento, dove la
    tecnica si perde e il carico cade in una posizione scomoda, come eccentrici a corpo libero, esercizi su una
    gamba in equilibrio, bilanciere sopra il viso (scelta di design, noFailure negli esercizi).
  en: For lifters with years of training, failure makes sense when it is selective, that is only on the
    last set of an exercise, more freely on isolation exercises and with caution on heavy compound lifts,
    which tire the whole body. Failure does not give more hypertrophy than stopping close to it (Refalo
    2023), but growth rises as you get closer (Robinson 2024); it is a choice for those who want harder
    sessions, not a requirement. Exercises that are risky close to failure, where form breaks down and the
    load ends in an awkward position, are also left out, such as bodyweight eccentrics, single-leg exercises that
    need balance, a barbell over the face (a design choice, noFailure on the exercises).
