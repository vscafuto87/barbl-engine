id: P-MYO-REPS
topic: intensity
statement:
  it: 'Nei myo-reps l''ultima serie va a cedimento (serie di attivazione) e poi seguono mini-serie di poche
    ripetizioni con lo stesso carico e pochi secondi di pausa, finché non si riescono più a fare. Il metodo
    rest-pause, che gli somiglia, dà adattamenti simili alle serie tradizionali in meno tempo; sui myo-reps
    non ci sono studi diretti. Valori di Barbl: attivazione 10-12, mini-serie da 3-4 con 5 secondi di pausa,
    stop sotto le 3 ripetizioni, al massimo 4 mini-serie (tetto scelto da Barbl per la durata).'
  en: 'In myo-reps the last set goes to failure (activation set), followed by mini-sets of a few reps with
    the same load and a few seconds of rest, until you can no longer complete them. Rest-pause, a similar
    method, gives adaptations similar to traditional sets in less time; there are no direct studies on myo-reps.
    Barbl values: activation 10-12, mini-sets of 3-4 with 5 seconds of rest, stop below 3 reps, at most 4
    mini-sets (a cap chosen by Barbl for session length).'
evidence: low
status: provisional
reviewedBy: null
