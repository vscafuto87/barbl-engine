notes:
  it: 'Una trazione in più nelle sedute della parte alta: la verticale dove la seduta ha solo la orizzontale (Full A, Full C, Upper del template a 5 giorni), una rematore a cavo o macchina altrove. Senza cavi né macchine si ricade su un rematore con manubri.'
