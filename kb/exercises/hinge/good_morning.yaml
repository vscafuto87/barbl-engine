id: good_morning
name:
  it: Good morning
  en: Good morning
equipment: barbell
requires:
- barbell
- rack
pattern: hinge
mechanics: compound
muscles:
  primary: hamstrings
  secondary:
  - glutes
loading:
  stepKg: 2.5
  whenLoadUnknown: manual
substitutes:
- romanian_deadlift
- stiff_leg_deadlift
- dumbbell_romanian_deadlift
technique:
  setup:
  - it: Prepara il bilanciere nel rack come per lo squat.
    en: Set the bar in the rack as you would for a squat.
  - it: Appoggialo sulle spalle, un po' più in basso dello squat.
    en: Rest it across your shoulders, a little lower than for a squat.
  - it: Esci dal rack, piedi alla larghezza delle anche, ginocchia morbide.
    en: Step out, feet hip-width, knees soft.
  cues:
  - it: Spingi il bacino indietro, schiena dritta.
    en: Push your hips back, back flat.
  - it: Scendi finché senti tirare i femorali, poi spingi il bacino avanti.
    en: Lower until your hamstrings pull, then drive your hips forward.
  mistakes:
  - what:
      it: Arrotondi la schiena in basso.
      en: Your back rounds at the bottom.
    fix:
      it: Scendi meno e tieni il petto aperto.
      en: Go less deep and keep your chest open.
  - what:
      it: Pieghi molto le ginocchia e diventa uno squat.
      en: You bend your knees a lot and it turns into a squat.
    fix:
      it: Ginocchia appena piegate e fisse.
      en: Knees only slightly bent and fixed.
  - what:
      it: Parti con un carico alto.
      en: You start with a heavy load.
    fix:
      it: 'Inizia leggero: è un esercizio che stanca molto la schiena.'
      en: 'Start light: this lift loads your lower back a lot.'
  sources:
  - id: nippard-muscle-ladder
    pages:
    - 143
    - 144
    access: full_text
  - id: nippard-ultimate-exercise-guide
    pages:
    - 15
    - 16
    access: full_text
  - id: barbl-design
    access: summary
    note: Errori comuni dalla pratica di coaching, da rivedere con il coach.
  status: provisional
  reviewedBy: null
