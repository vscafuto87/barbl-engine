id: spider_curl
name:
  it: Spider curl
  en: Spider curl
equipment: dumbbell
requires:
- dumbbells
- bench
pattern: elbow_flexion
mechanics: isolation
muscles:
  primary: biceps
  secondary: []
loading:
  stepKg: 2.5
  whenLoadUnknown: manual
substitutes:
- dumbbell_preacher_curl
- dumbbell_curl
- cable_curl
technique:
  setup:
  - it: Inclina lo schienale di circa 45 gradi.
    en: Set the backrest to about 45 degrees.
  - it: Sdraiati a pancia in giù con il petto in cima allo schienale.
    en: Lie face down with your chest at the top of the backrest.
  - it: Lascia pendere le braccia tese con i manubri, palmi in avanti.
    en: Let your arms hang straight with the dumbbells, palms forward.
  cues:
  - it: Piega i gomiti e porta i manubri verso le spalle.
    en: Bend your elbows and curl the dumbbells toward your shoulders.
  - it: Gomiti fermi sotto le spalle.
    en: Elbows still, under your shoulders.
  mistakes:
  - what:
      it: I gomiti vanno avanti per aiutarti.
      en: Your elbows swing forward to help.
    fix:
      it: Tieni le braccia verticali.
      en: Keep your upper arms vertical.
  - what:
      it: Scendi solo a metà.
      en: You only come halfway down.
    fix:
      it: Distendi le braccia del tutto in basso.
      en: Straighten your arms fully at the bottom.
  - what:
      it: Usi un carico troppo alto e ti stacchi dalla panca.
      en: You go too heavy and lift off the bench.
    fix:
      it: Riduci il carico e resta appoggiato.
      en: Lower the load and stay on the bench.
  sources:
  - id: nippard-muscle-ladder
    pages:
    - 217
    access: full_text
  - id: barbl-design
    access: summary
    note: Errori comuni dalla pratica di coaching, da rivedere con il coach.
  status: provisional
  reviewedBy: null
