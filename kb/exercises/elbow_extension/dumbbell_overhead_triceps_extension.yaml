id: dumbbell_overhead_triceps_extension
name:
  it: Estensioni sopra la testa con manubrio
  en: Dumbbell overhead triceps extension
equipment: dumbbell
requires:
- dumbbells
pattern: elbow_extension
mechanics: isolation
muscles:
  primary: triceps
  secondary: []
loading:
  stepKg: 2.5
  whenLoadUnknown: manual
substitutes:
- overhead_cable_triceps_extension
- barbell_skull_crusher
- lying_dumbbell_triceps_extension
technique:
  setup:
  - it: Siediti con lo schienale dritto e tieni un manubrio con due mani.
    en: Sit upright and hold one dumbbell with both hands.
  - it: Sostieni un'estremità del manubrio con i palmi a coppa.
    en: Cup the top end of the dumbbell with both palms.
  - it: Portalo sopra la testa con le braccia tese.
    en: Raise it overhead with straight arms.
  - it: Piedi a terra, glutei e schiena appoggiati.
    en: Feet flat, hips and back on the seat.
  - it: Piega i gomiti e porta il manubrio dietro la testa.
    en: Bend your elbows and lower the dumbbell behind your head.
  cues:
  - it: Muovi solo gli avambracci, i gomiti restano fermi.
    en: Move only your forearms; your elbows stay still.
  - it: Gomiti puntati in alto e vicini alla testa.
    en: Elbows pointing up, close to your head.
  - it: Senti l'allungamento in basso, poi stendi.
    en: Feel the stretch at the bottom, then extend.
  mistakes:
  - what:
      it: I gomiti si aprono ai lati.
      en: Your elbows flare out to the sides.
    fix:
      it: Tienili vicini alla testa e rivolti in alto.
      en: Keep them close to your head, pointing up.
  - what:
      it: La schiena si inarca e le costole sporgono.
      en: Your back arches and your ribs flare.
    fix:
      it: Stringi glutei e addome e riduci il carico.
      en: Squeeze your glutes and abs and lower the load.
  - what:
      it: Scendi poco e perdi l'allungamento.
      en: You lower only a little and lose the stretch.
    fix:
      it: Scendi finché senti il tricipite allungarsi.
      en: Lower until you feel your triceps stretch.
  - what:
      it: Il manubrio scivola o ondeggia.
      en: The dumbbell slips or wobbles.
    fix:
      it: Tienilo saldo con entrambe le mani e riduci il carico.
      en: Hold it firmly with both hands and lower the load.
  sources:
  - id: nippard-muscle-ladder
    pages:
    - 220
    - 221
    access: full_text
  - id: barbl-design
    access: summary
    note: Errori comuni dalla pratica di coaching, da rivedere con il coach.
  status: provisional
