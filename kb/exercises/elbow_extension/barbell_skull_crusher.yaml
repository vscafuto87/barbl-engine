id: barbell_skull_crusher
name:
  it: French press con bilanciere
  en: Barbell skull crusher
equipment: barbell
requires:
- barbell
- bench
pattern: elbow_extension
mechanics: isolation
muscles:
  primary: triceps
  secondary: []
loading:
  stepKg: 2.5
  whenLoadUnknown: manual
substitutes:
- dumbbell_overhead_triceps_extension
- lying_dumbbell_triceps_extension
technique:
  setup:
  - it: Sdraiati sulla panca con il bilanciere EZ in mano, presa stretta.
    en: Lie on the bench holding the bar with a narrow grip.
  - it: Portalo sopra il petto con le braccia tese.
    en: Hold it over your chest with straight arms.
  - it: Piedi a terra, testa e schiena appoggiate.
    en: Feet flat, head and back on the bench.
  - it: Braccia un po' inclinate verso la testa, gomiti vicini tra loro.
    en: Upper arms angled slightly toward your head, elbows close together.
  - it: Piega solo i gomiti e porta il bilanciere dietro la testa.
    en: Bend only your elbows and lower the bar behind your head.
  cues:
  - it: Solo i gomiti si muovono, le spalle restano ferme.
    en: Only your elbows move; your shoulders stay still.
  - it: Le braccia restano con la stessa inclinazione per tutta la serie.
    en: Keep your upper arms at the same angle all set.
  - it: Stendi le braccia senza bloccare i gomiti con forza.
    en: Extend your arms without snapping your elbows.
  mistakes:
  - what:
      it: I gomiti si aprono ai lati.
      en: Your elbows flare out to the sides.
    fix:
      it: Tienili vicini e rivolti in alto.
      en: Keep them close and pointing up.
  - what:
      it: Le spalle si muovono e diventa una spinta.
      en: Your shoulders move and it turns into a press.
    fix:
      it: Blocca la parte alta del braccio e piega solo i gomiti.
      en: Lock your upper arms and bend only the elbows.
  - what:
      it: Il bilanciere scende troppo veloce verso la testa.
      en: The bar drops too fast toward your head.
    fix:
      it: Scendi piano e riduci il carico.
      en: Lower slowly and reduce the load.
  - what:
      it: I polsi si piegano e senti fastidio ai gomiti.
      en: Your wrists bend and your elbows feel sore.
    fix:
      it: Usa una presa comoda e tieni i polsi dritti.
      en: Use a comfortable grip and keep your wrists straight.
