        it: 'Secondo giro della settimana (P-SPLIT-PPL-6D, P-ADV-STRUCTURE): il principale è una trazione
          dall''alto e si allena a 8-12 ripetizioni, mentre il primo giro parte dal rematore pesante.'
      candidates:
