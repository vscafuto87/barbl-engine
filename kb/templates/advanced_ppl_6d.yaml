principles:
- P-SPLIT-PPL-6D
- P-ADV-STRUCTURE
- P-ADV-FAILURE-LAST-SET
- P-DROP-SET
- P-MYO-REPS
- P-SUPERSET-ANTAGONIST
- P-CORE-FINISHER
- P-FREQ-MIN-2
- P-FREQ-HYP-NEUTRAL
- P-PATTERNS
- P-VOL-MIN-10
- P-RECOVERY-48H
- P-TIME-PER-SET
structureSources:
- id: nippard-ppl-6x
  note: 'pp. 35-40, solo struttura: spinta, trazione e gambe ripetute due volte nella settimana'
- id: nippard-powerbuilding-2-6x
  note: 'pp. 18-20, solo struttura: settimane a spinta, trazione e gambe per intermedi e avanzati'
- id: nippard-bodybuilding-transformation
  note: 'pp. 9-10 e 19: serie iniziali vicine al cedimento, ultima serie a cedimento e tecniche solo dopo
    l''ultima serie'
- id: helms-pyramid-training-v2
  note: 'pp. 177-181: coppie di antagonisti tra isolamenti, mai con squat e stacchi'
notes:
  it: Template del livello avanzato a sei giorni (P-SPLIT-PPL-6D), solo per chi si allena da più di due
    anni. Push, Pull e Gambe due volte, da lunedì a sabato. Il giro A parte da panca, rematore e squat
    pesanti; il giro B usa una spinta inclinata o con manubri, una trazione dall'alto e la pressa o l'hack
    squat, a 8-12 ripetizioni. Ogni muscolo è primario in una sola seduta per giro, quindi mai in due
    giorni di fila (i deltoidi posteriori stanno nel Push, lo stacco rumeno nelle Gambe). Ogni seduta ha
    un superset di isolamenti di muscoli diversi e al più due drop set o myo-reps; nessuna tecnica sui
    principali né sui multiarticolari pesanti. Il finisher degli addominali chiude le due sedute delle
    gambe, mercoledì e sabato. I polpacci, quando c'è tempo, ricevono un'estensione nel Push A del lunedì,
    che segue la domenica di riposo e precede il Pull, e restano fuori dai giorni consecutivi alle Gambe.
