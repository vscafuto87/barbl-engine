    it: Push B
    en: Push B
  focus: upper_body
  blocks:
  - type: single
    slots:
    - pattern: horizontal_push
      role: main
      equivalent: 2
      repsOverride:
        min: 8
        max: 12
      overrideReason:
        it: 'Secondo giro della settimana (P-SPLIT-PPL-6D, P-ADV-STRUCTURE): il principale è una variante
          inclinata o con manubri e si allena a 8-12 ripetizioni, mentre il primo giro resta pesante.'
      candidates:
      - incline_dumbbell_press
      - smith_machine_incline_press
  - type: single
    slots:
    - pattern: vertical_push
      role: secondary
      equivalent: 6
      candidates:
      - machine_shoulder_press
      - seated_dumbbell_shoulder_press
      - dumbbell_arnold_press
      - standing_dumbbell_shoulder_press
      - smith_machine_shoulder_press
      - landmine_press
      - military_press
  - type: superset
