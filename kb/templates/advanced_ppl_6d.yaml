id: advanced_ppl_6d
split: push_pull_legs
daysPerWeek: 6
goals:
- muscle_gain
- both
- strength
experience:
- over_2_years
defaultSchedule:
  mon: push_a
  tue: pull_a
  wed: legs_a
  thu: push_b
  fri: pull_b
  sat: legs_b
sessions:
- id: push_a
  name:
    it: Push A
    en: Push A
  focus: upper_body
  blocks:
  - type: single
    slots:
    - pattern: horizontal_push
      role: main
      askLoad: true
      candidates:
      - barbell_bench_press
      - dumbbell_bench_press
      - machine_chest_press
      - smith_machine_bench_press
      - push_up
      - incline_barbell_bench_press
      - incline_machine_press
      - dip
      - deficit_push_up
      - dumbbell_floor_press
      - close_grip_bench_press
  - type: single
    slots:
    - pattern: horizontal_push
      role: secondary
      equivalent: 6
      candidates:
      - incline_dumbbell_press
      - machine_chest_press
      - incline_barbell_bench_press
      - incline_machine_press
      - smith_machine_incline_press
      - dip
      - deficit_push_up
      - push_up
      - dumbbell_floor_press
      - close_grip_bench_press
  - type: single
    slots:
    - pattern: vertical_push
      role: secondary
      equivalent: 6
      candidates:
      - seated_dumbbell_shoulder_press
      - dumbbell_arnold_press
      - machine_shoulder_press
      - standing_dumbbell_shoulder_press
      - landmine_press
      - smith_machine_shoulder_press
      - military_press
  - type: superset
    label: A
    slots:
    - pattern: chest_isolation
      role: accessory
      equivalent: 5
      lastSet: failure
      candidates:
      - cable_fly
      - dumbbell_fly
      - pec_deck_fly
      - incline_dumbbell_fly
      - low_to_high_cable_fly
    - pattern: elbow_extension
      role: accessory
      equivalent: 4
      lastSet: failure
      candidates:
      - cable_triceps_pushdown
      - lying_dumbbell_triceps_extension
      - barbell_skull_crusher
      - cable_triceps_kickback
      - dumbbell_triceps_kickback
      - close_grip_push_up
  - type: single
    slots:
    - pattern: lateral_raise
      role: accessory
      equivalent: 6
      lastSet: drop_set
      candidates:
      - cable_lateral_raise
      - dumbbell_lateral_raise
      - lying_incline_lateral_raise
      - cable_y_raise
      - lean_in_lateral_raise
      - egyptian_lateral_raise
      - machine_lateral_raise
      - cable_upright_row
- id: pull_a
  name:
    it: Pull A
    en: Pull A
  focus: upper_body
  blocks:
  - type: single
    slots:
    - pattern: horizontal_pull
      role: main
      askLoad: true
      candidates:
      - barbell_row
      - chest_supported_dumbbell_row
      - seated_cable_row
      - incline_bench_barbell_row
      - single_arm_cable_row
      - inverted_row
      - chest_supported_t_bar_row
      - pendlay_row
      - meadows_row
      - elbows_out_cable_row
  - type: single
    slots:
    - pattern: vertical_pull
      role: secondary
      equivalent: 4
      candidates:
      - lat_pulldown
      - neutral_grip_pulldown
      - single_arm_lat_pulldown
      - underhand_lat_pulldown
      - machine_pulldown
      - pull_up
      - chin_up
      - neutral_grip_pull_up
      - dumbbell_row
  - type: superset
    label: A
    slots:
    - pattern: elbow_flexion
      role: accessory
      equivalent: 5
      lastSet: failure
      candidates:
      - incline_dumbbell_curl
      - behind_the_body_cable_curl
      - machine_preacher_curl
      - ez_bar_preacher_curl
      - spider_curl
      - concentration_curl
