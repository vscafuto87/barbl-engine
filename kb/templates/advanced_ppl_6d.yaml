      role: accessory
      equivalent: 2
      lastSet: failure
      candidates:
      - straight_arm_lat_pulldown
      - machine_pullover
      - dumbbell_pullover
  - type: single
    slots:
    - pattern: elbow_flexion
      role: accessory
      equivalent: 5
      lastSet: drop_set
      candidates:
