      - smith_machine_split_squat
      - barbell_lunge
      - dumbbell_step_up
  - type: superset
    label: A
    slots:
    - pattern: knee_flexion
      role: accessory
      equivalent: 5
      lastSet: failure
      candidates: *knee_flexion
    - pattern: calf_raise
      role: accessory
      equivalent: 6
      lastSet: failure
      candidates:
      - dumbbell_calf_raise
      - standing_calf_raise
      - leg_press_calf_raise
      - smith_machine_calf_raise
      - single_leg_dumbbell_calf_raise
      - donkey_calf_raise
      - seated_calf_raise
  - type: single
