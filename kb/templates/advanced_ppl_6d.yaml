      equivalent: 6
      candidates:
      - romanian_deadlift
      - dumbbell_romanian_deadlift
      - good_morning
      - stiff_leg_deadlift
      - deadlift
      - sumo_deadlift
  - type: superset
    label: A
    slots:
    - pattern: knee_extension
      role: accessory
      equivalent: 2
      lastSet: failure
      candidates: &knee_extension
      - leg_extension
      - reverse_nordic
      - sissy_squat
      - bulgarian_split_squat
      - goblet_squat
    - pattern: knee_flexion
      role: accessory
      equivalent: 5
      lastSet: failure
      candidates: &knee_flexion
      - seated_leg_curl
      - standing_leg_curl
      - dumbbell_leg_curl
      - single_leg_curl
      - leg_curl
  - type: single
    slots:
    - pattern: hip_extension
      role: accessory
      equivalent: 5
      lastSet: myo_reps
      candidates:
      - barbell_hip_thrust
      - dumbbell_hip_thrust
      - machine_hip_thrust
      - smith_machine_hip_thrust
      - single_leg_hip_thrust
      - back_extension_45
      - cable_glute_kickback
  - type: single
    slots:
    - pattern: calf_raise
      role: accessory
      equivalent: 6
      lastSet: drop_set
      candidates:
      - standing_calf_raise
      - dumbbell_calf_raise
      - leg_press_calf_raise
      - smith_machine_calf_raise
      - single_leg_dumbbell_calf_raise
      - donkey_calf_raise
      - seated_calf_raise
  - type: single
    slots:
    - pattern: trunk_flexion
      role: core
      equivalent: 5
      candidates:
      - cable_crunch
      - machine_crunch
      - weighted_crunch
      - decline_sit_up
      - bicycle_crunch
- id: push_b
