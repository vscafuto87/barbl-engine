id: upper_lower_4d
split: upper_lower
daysPerWeek: 4
goals:
- muscle_gain
- both
- strength
defaultSchedule:
  mon: upper_b
  wed: lower_b
  thu: upper_a
  sat: lower_a
sessions:
- id: upper_a
  name:
    it: Upper A
    en: Upper A
  focus: upper_body
  blocks:
  - type: single
    slots:
    - pattern: horizontal_push
      role: main
      askLoad: true
      candidates:
      - barbell_bench_press
      - dumbbell_bench_press
      - machine_chest_press
      - push_up
      - incline_barbell_bench_press
      - incline_machine_press
      - dip
      - smith_machine_incline_press
      - deficit_push_up
      - dumbbell_floor_press
      - close_grip_bench_press
  - type: superset
    label: A
    slots:
    - pattern: horizontal_pull
      role: secondary
      equivalent: 2
      askLoad: true
      candidates:
      - dumbbell_row
      - seated_cable_row
      - barbell_row
      - incline_bench_barbell_row
      - single_arm_cable_row
      - inverted_row
      - chest_supported_t_bar_row
      - pendlay_row
      - meadows_row
    - pattern: vertical_push
      role: secondary
      askLoad: true
      candidates:
      - military_press
      - seated_dumbbell_shoulder_press
      - machine_shoulder_press
      - standing_dumbbell_shoulder_press
      - landmine_press
      - smith_machine_shoulder_press
      repsOverride:
        min: 6
        max: 8
      overrideReason:
        it: 'Come nel piano fisso dell''app: il carico noto del profilo d''esempio (47,5 kg × 7) sta in
          6-8, non nell''intervallo del ruolo secondario.'
  - type: single
    slots:
    - pattern: vertical_pull
      role: secondary
      equivalent: 4
      candidates:
      - lat_pulldown
      - neutral_grip_pulldown
      - single_arm_lat_pulldown
      - underhand_lat_pulldown
      - machine_pulldown
      - pull_up
      - chin_up
      - chest_supported_dumbbell_row
  - type: superset
    label: B
    slots:
    - pattern: elbow_extension
      role: accessory
      equivalent: 4
      candidates:
      - overhead_cable_triceps_extension
      - dumbbell_overhead_triceps_extension
      - barbell_overhead_triceps_extension
      - lying_dumbbell_triceps_extension
      - cable_triceps_pushdown
      - barbell_skull_crusher
      - cable_triceps_kickback
      - dumbbell_triceps_kickback
    - pattern: elbow_flexion
      role: accessory
      equivalent: 7
      candidates:
      - incline_dumbbell_curl
      - dumbbell_preacher_curl
      - cable_curl
      - dumbbell_curl
      - behind_the_body_cable_curl
      - machine_preacher_curl
      - ez_bar_curl
      - hammer_curl
      - barbell_curl
      - spider_curl
      - concentration_curl
- id: lower_a
  name:
    it: Lower A
    en: Lower A
  focus: legs
  blocks:
  - type: single
    slots:
    - pattern: squat
      role: main
      askLoad: true
      candidates:
      - squat
      - leg_press
      - goblet_squat
      - front_squat
      - pendulum_squat
      - belt_squat
  - type: single
    slots:
    - pattern: knee_flexion
      role: accessory
      equivalent: 4
      candidates:
      - seated_leg_curl
      - standing_leg_curl
      - dumbbell_leg_curl
      - glute_ham_raise
      - single_leg_dumbbell_romanian_deadlift
      - leg_curl
      - dumbbell_romanian_deadlift
      - nordic_curl
  - type: single
    slots:
    - pattern: knee_extension
      role: accessory
      equivalent: 2
      candidates:
      - leg_extension
      - reverse_nordic
      - sissy_squat
      - bulgarian_split_squat
      - goblet_squat
  - type: single
    slots:
    - pattern: calf_raise
      role: accessory
      equivalent: 6
      candidates:
      - standing_calf_raise
      - dumbbell_calf_raise
      - leg_press_calf_raise
      - smith_machine_calf_raise
      - single_leg_dumbbell_calf_raise
      - donkey_calf_raise
      - seated_calf_raise
- id: upper_b
  name:
    it: Upper B
    en: Upper B
  focus: upper_body
  blocks:
  - type: single
    slots:
    - pattern: horizontal_push
      role: main
      equivalent: 2
      candidates:
      - incline_dumbbell_press
      - machine_chest_press
      - push_up
      - incline_barbell_bench_press
      - incline_machine_press
      - dip
      - smith_machine_incline_press
      - deficit_push_up
      - dumbbell_floor_press
      - close_grip_bench_press
  - type: single
    slots:
    - pattern: horizontal_pull
      role: secondary
      equivalent: 6
      candidates:
      - seated_cable_row
      - chest_supported_dumbbell_row
      - incline_bench_barbell_row
      - single_arm_cable_row
      - chest_supported_t_bar_row
      - pendlay_row
      - barbell_row
      - inverted_row
      - meadows_row
  - type: single
    slots:
    - pattern: vertical_pull
      role: secondary
      equivalent: 4
      candidates:
      - lat_pulldown
      - neutral_grip_pulldown
      - single_arm_lat_pulldown
      - underhand_lat_pulldown
      - machine_pulldown
      - pull_up
      - chin_up
      - dumbbell_row
  - type: single
    slots:
    - pattern: chest_isolation
      role: accessory
      equivalent: 5
      candidates:
      - cable_fly
      - dumbbell_fly
      - pec_deck_fly
      - incline_dumbbell_fly
      - low_to_high_cable_fly
      - push_up
  - type: superset
    label: A
    slots:
    - pattern: elbow_flexion
      role: accessory
      equivalent: 7
      candidates:
      - incline_dumbbell_curl
      - dumbbell_preacher_curl
      - cable_curl
      - dumbbell_curl
      - behind_the_body_cable_curl
      - machine_preacher_curl
      - ez_bar_curl
      - hammer_curl
      - barbell_curl
      - spider_curl
      - concentration_curl
    - pattern: elbow_extension
      role: accessory
      equivalent: 4
      candidates:
      - overhead_cable_triceps_extension
      - dumbbell_overhead_triceps_extension
      - barbell_overhead_triceps_extension
      - lying_dumbbell_triceps_extension
      - cable_triceps_pushdown
      - barbell_skull_crusher
      - cable_triceps_kickback
      - dumbbell_triceps_kickback
- id: lower_b
  name:
    it: Lower B
    en: Lower B
  focus: legs
  blocks:
  - type: single
    slots:
    - pattern: hinge
      role: main
      candidates:
      - romanian_deadlift
      - dumbbell_romanian_deadlift
      - good_morning
      - stiff_leg_deadlift
      - deadlift
      - sumo_deadlift
  - type: single
    slots:
    - pattern: squat
      role: secondary
      equivalent: 5
      candidates:
      - leg_press
      - hack_squat
      - front_squat
      - pendulum_squat
      - belt_squat
      - goblet_squat
      - smith_machine_squat
  - type: single
    slots:
    - pattern: lunge
      role: secondary
      equivalent: 5
      candidates:
      - bulgarian_split_squat
      - dumbbell_walking_lunge
      - dumbbell_reverse_lunge
      - smith_machine_split_squat
      - barbell_lunge
      - dumbbell_step_up
  - type: single
    slots:
    - pattern: knee_flexion
      role: accessory
      equivalent: 4
      candidates:
      - seated_leg_curl
      - standing_leg_curl
      - dumbbell_leg_curl
      - glute_ham_raise
      - single_leg_dumbbell_romanian_deadlift
      - leg_curl
      - dumbbell_romanian_deadlift
      - nordic_curl
  - type: single
    slots:
    - pattern: calf_raise
      role: accessory
      equivalent: 6
      candidates:
      - dumbbell_calf_raise
      - standing_calf_raise
      - leg_press_calf_raise
      - smith_machine_calf_raise
      - single_leg_dumbbell_calf_raise
      - donkey_calf_raise
      - seated_calf_raise
principles:
- P-FREQ-MIN-2
- P-FREQ-HYP-NEUTRAL
- P-PATTERNS
- P-VOL-MIN-10
structureSources:
- id: nippard-essentials
  note: 'struttura della seduta Upper della versione 4x: spinta orizzontale pesante, trazioni, spinta
    verticale, superset di braccia'
notes:
  it: Upper A e Lower A partono dal piano fisso dell'app (panca, superset rematore e military, squat,
    leg curl); il resto completa gli slot che nel piano fisso erano da definire. Per ogni slot il motore
    sceglie il primo candidato disponibile nella palestra del profilo.
