principles:
- P-ADV-STRUCTURE
- P-ADV-FAILURE-LAST-SET
- P-DROP-SET
- P-MYO-REPS
- P-SUPERSET-ANTAGONIST
- P-SPLIT-PPL-UL-5D
- P-FREQ-MIN-2
- P-PATTERNS
- P-VOL-MIN-10
- P-RECOVERY-48H
- P-TIME-PER-SET
structureSources:
- id: nippard-bodybuilding-transformation
  note: 'pp. 9-10 e 19: serie iniziali vicine al cedimento, ultima serie a cedimento e tecniche solo dopo
    l''ultima serie'
- id: nippard-pure-bodybuilding-2
  note: 'solo struttura: più esercizi con meno serie, tecniche sugli isolamenti'
- id: helms-pyramid-training-v2
  note: 'pp. 177-181: coppie di antagonisti tra isolamenti, mai con squat e stacchi'
- id: nippard-essentials
  note: 'versione 5x, pp. 20-24: ordine delle sedute nella settimana'
notes:
  it: Template del livello avanzato (P-ADV-STRUCTURE), sedute e calendario di ppl_ul_5d. Ogni seduta ha
    un superset di isolamenti tra muscoli diversi (in Pull deltoidi posteriori e polpacci, superset di
    muscoli non collegati, P-SUPERSET-ANTAGONIST) e al più due drop set o myo-reps. Nessuna tecnica sui
    principali né sui multiarticolari pesanti.
