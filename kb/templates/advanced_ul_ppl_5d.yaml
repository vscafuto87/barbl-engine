id: advanced_ul_ppl_5d
split: push_pull_legs
daysPerWeek: 5
goals:
- muscle_gain
- both
- strength
experience:
- over_2_years
defaultSchedule:
  mon: upper
  tue: lower
  thu: push
  fri: pull
  sat: legs
sessions:
- id: push
  name:
    it: Push
    en: Push
  focus: upper_body
  blocks:
  - type: single
    slots:
    - pattern: horizontal_push
      role: main
      askLoad: true
      candidates:
      - barbell_bench_press
      - dumbbell_bench_press
      - machine_chest_press
      - push_up
      - incline_barbell_bench_press
      - incline_machine_press
      - dip
      - smith_machine_incline_press
      - deficit_push_up
      - dumbbell_floor_press
      - close_grip_bench_press
  - type: single
    slots:
    - pattern: horizontal_push
      role: secondary
      equivalent: 6
      candidates:
      - incline_dumbbell_press
      - machine_chest_press
      - incline_barbell_bench_press
      - incline_machine_press
      - smith_machine_incline_press
      - deficit_push_up
      - push_up
      - dip
      - dumbbell_floor_press
      - close_grip_bench_press
  - type: single
    slots:
    - pattern: vertical_push
      role: secondary
      equivalent: 6
      candidates:
      - seated_dumbbell_shoulder_press
      - dumbbell_arnold_press
      - machine_shoulder_press
      - standing_dumbbell_shoulder_press
      - landmine_press
      - smith_machine_shoulder_press
      - military_press
  - type: superset
    label: A
    slots:
    - pattern: chest_isolation
      role: accessory
      equivalent: 5
      lastSet: failure
      candidates:
      - cable_fly
      - dumbbell_fly
      - pec_deck_fly
      - incline_dumbbell_fly
      - low_to_high_cable_fly
    - pattern: elbow_extension
      role: accessory
      equivalent: 4
      lastSet: failure
      candidates:
      - overhead_cable_triceps_extension
      - dumbbell_overhead_triceps_extension
      - barbell_overhead_triceps_extension
      - lying_dumbbell_triceps_extension
      - cable_triceps_pushdown
      - barbell_skull_crusher
      - cable_triceps_kickback
      - dumbbell_triceps_kickback
      - jm_press
      - close_grip_push_up
  - type: single
    slots:
    - pattern: lateral_raise
      role: accessory
      equivalent: 6
      lastSet: drop_set
      candidates:
      - cable_lateral_raise
      - dumbbell_lateral_raise
      - lying_incline_lateral_raise
      - cable_y_raise
      - lean_in_lateral_raise
      - egyptian_lateral_raise
