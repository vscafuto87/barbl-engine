principles:
- P-ADV-STRUCTURE
- P-ADV-FAILURE-LAST-SET
- P-DROP-SET
- P-MYO-REPS
- P-SUPERSET-ANTAGONIST
- P-FREQ-MIN-2
- P-PATTERNS
- P-VOL-MIN-10
structureSources:
- id: nippard-bodybuilding-transformation
  note: 'pp. 9-10 e 19: serie iniziali vicine al cedimento, ultima serie a cedimento e tecniche solo dopo
    l''ultima serie'
- id: nippard-pure-bodybuilding-2
  note: 'solo struttura: più esercizi con meno serie, tecniche sugli isolamenti'
- id: helms-pyramid-training-v2
  note: 'pp. 177-181: coppie di antagonisti tra isolamenti, mai con squat e stacchi'
notes:
  it: Template del livello avanzato (P-ADV-STRUCTURE), sedute e calendario di upper_lower_4d. Upper A
    e Lower A sono il giro pesante, Upper B il giro più leggero (principale a 8-12). Ogni seduta ha almeno
    un superset tra isolamenti di muscoli diversi e l'ultima serie degli isolamenti a cedimento, con al
    più due drop set o myo-reps (blocchi singoli, P-DROP-SET, P-MYO-REPS). Nessuna tecnica sui principali,
    sui multiarticolari pesanti (heavyCompound) né sugli esercizi rischiosi vicino al cedimento (noFailure).
    Upper A chiude con i polpacci senza drop set e Lower A prende per prima un'estensione d'anca, così
    a 60 minuti polpacci e glutei restano almeno come nel template normale (C-ADVANCED-VOLUME).
