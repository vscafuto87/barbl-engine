id: advanced_upper_lower_4d
split: upper_lower
daysPerWeek: 4
goals:
- muscle_gain
- both
- strength
experience:
- over_2_years
defaultSchedule:
  mon: upper_b
  wed: lower_b
  thu: upper_a
  sat: lower_a
sessions:
- id: upper_a
  name:
    it: Upper A
    en: Upper A
  focus: upper_body
  blocks:
  - type: single
    slots:
    - pattern: horizontal_push
      role: main
      askLoad: true
      candidates:
      - barbell_bench_press
      - dumbbell_bench_press
      - machine_chest_press
      - push_up
      - incline_barbell_bench_press
      - incline_machine_press
      - dip
      - smith_machine_incline_press
      - deficit_push_up
      - dumbbell_floor_press
      - close_grip_bench_press
  - type: single
    slots:
    - pattern: horizontal_pull
      role: secondary
      equivalent: 2
      askLoad: true
      candidates:
      - dumbbell_row
      - seated_cable_row
      - barbell_row
      - incline_bench_barbell_row
      - single_arm_cable_row
      - inverted_row
      - chest_supported_t_bar_row
      - pendlay_row
      - meadows_row
      - elbows_out_cable_row
