        max: 12
      overrideReason:
        it: 'Giro più leggero della settimana (P-ADV-STRUCTURE): il principale si allena a 8-12 ripetizioni,
          come nei programmi per intermedi e avanzati che alternano una seduta pesante e una più leggera.'
