principles:
- P-SPLIT-FULL-BODY-3D
- P-FREQ-MIN-2
- P-FREQ-HYP-NEUTRAL
- P-PATTERNS
- P-VOL-MIN-10
- P-RECOVERY-48H
notes:
  it: 'Struttura scelta da Barbl (principio di design P-SPLIT-FULL-BODY-3D), non ripresa da una fonte.
    Ogni seduta ha una spinta, una trazione e una gamba; nella settimana petto, dorso, quadricipiti,
    bicipiti e tricipiti superano le 10 serie frazionarie e hanno tre stimoli. Lunedì, mercoledì e
    venerdì lasciano almeno 48 ore tra le sedute. Al massimo 18 serie per seduta (circa 54 minuti): il
    template copre le durate da 60 minuti in su; con 45 minuti il profilo resta non coperto per durata.
    I polpacci non hanno uno slot (vedi C-CALVES-BAND). Con la palestra a soli manubri alcuni slot ripetono lo stesso esercizio in sedute
    diverse, perché il catalogo ne ha pochi per pattern.'
