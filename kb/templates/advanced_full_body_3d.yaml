      - jm_press
      - close_grip_push_up
    - pattern: elbow_flexion
      role: accessory
      equivalent: 8
      lastSet: failure
      candidates:
      - incline_dumbbell_curl
      - dumbbell_preacher_curl
      - cable_curl
      - dumbbell_curl
      - behind_the_body_cable_curl
      - machine_preacher_curl
      - ez_bar_curl
      - ez_bar_preacher_curl
      - hammer_curl
      - barbell_curl
      - spider_curl
      - concentration_curl
  - type: single
