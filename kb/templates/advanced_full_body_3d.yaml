id: advanced_full_body_3d
split: full_body
daysPerWeek: 3
goals:
- muscle_gain
- both
- strength
experience:
- over_2_years
defaultSchedule:
  mon: full_a
  wed: full_b
  fri: full_c
sessions:
- id: full_a
  name:
    it: Full body A
    en: Full body A
  focus: full_body
  blocks:
  - type: single
    slots:
    - pattern: horizontal_push
      role: main
      askLoad: true
      candidates:
      - barbell_bench_press
      - dumbbell_bench_press
      - machine_chest_press
      - push_up
      - incline_barbell_bench_press
      - incline_machine_press
      - dip
      - smith_machine_incline_press
      - deficit_push_up
      - dumbbell_floor_press
      - close_grip_bench_press
  - type: single
    slots:
    - pattern: squat
      role: main
      askLoad: true
      candidates:
      - squat
      - leg_press
      - goblet_squat
      - front_squat
      - pendulum_squat
      - belt_squat
      - single_leg_press
  - type: single
    slots:
    - pattern: horizontal_pull
      role: secondary
      equivalent: 2
      askLoad: true
      candidates:
      - dumbbell_row
      - seated_cable_row
      - barbell_row
      - incline_bench_barbell_row
      - single_arm_cable_row
      - inverted_row
      - chest_supported_t_bar_row
      - pendlay_row
      - meadows_row
      - elbows_out_cable_row
  - type: superset
    label: A
    slots:
    - pattern: elbow_extension
      role: accessory
      equivalent: 4
      lastSet: failure
      candidates:
      - overhead_cable_triceps_extension
      - dumbbell_overhead_triceps_extension
      - barbell_overhead_triceps_extension
      - lying_dumbbell_triceps_extension
      - cable_triceps_pushdown
