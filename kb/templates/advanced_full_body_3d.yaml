principles:
- P-ADV-STRUCTURE
- P-ADV-FAILURE-LAST-SET
- P-DROP-SET
- P-MYO-REPS
- P-SUPERSET-ANTAGONIST
- P-SPLIT-FULL-BODY-3D
- P-FREQ-MIN-2
- P-PATTERNS
- P-VOL-MIN-10
- P-RECOVERY-48H
structureSources:
- id: nippard-bodybuilding-transformation
  note: 'pp. 9-10 e 19: serie iniziali vicine al cedimento, ultima serie a cedimento e tecniche solo dopo
    l''ultima serie'
- id: nippard-pure-bodybuilding-2
  note: 'solo struttura: più esercizi con meno serie, tecniche sugli isolamenti'
- id: helms-pyramid-training-v2
  note: 'pp. 177-181: coppie di antagonisti tra isolamenti, mai con squat e stacchi'
notes:
  it: Template del livello avanzato (P-ADV-STRUCTURE), giorni di full_body_3d. Ogni seduta ha uno o due
    multiarticolari pesanti senza tecniche, un complementare, un superset di isolamenti tra muscoli diversi
    e al più due drop set o myo-reps su isolamenti in blocchi singoli. Full B ha lo stacco come principale.
    I polpacci entrano in Full C come isolamento con myo-reps.
