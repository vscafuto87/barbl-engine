# Pattern di movimento. Il motore riempie gli slot dei template per pattern e la regola 12
# (riscaldamento) si applica al primo multiarticolare di ogni pattern.
# La suddivisione segue il principio P-PATTERNS (ACSM 2026): spinta e trazione per parte alta
# e bassa, orizzontale e verticale per la parte alta; più gli isolamenti per distretto.
patterns:
  - { id: horizontal_push, region: upper, mechanics: compound,  name: { it: Spinta orizzontale, en: Horizontal push } }
  - { id: vertical_push,   region: upper, mechanics: compound,  name: { it: Spinta verticale,   en: Vertical push } }
  - { id: horizontal_pull, region: upper, mechanics: compound,  name: { it: Trazione orizzontale, en: Horizontal pull } }
  - { id: vertical_pull,   region: upper, mechanics: compound,  name: { it: Trazione verticale, en: Vertical pull } }
  - { id: squat,           region: lower, mechanics: compound,  name: { it: Accosciata,         en: Squat } }
  - { id: lunge,           region: lower, mechanics: compound,  name: { it: Affondo,            en: Lunge } }
  - { id: hinge,           region: lower, mechanics: compound,  name: { it: Piegamento d'anca,  en: Hip hinge } }
  - { id: chest_isolation, region: upper, mechanics: isolation, name: { it: Isolamento petto,   en: Chest isolation } }
  - { id: elbow_extension, region: upper, mechanics: isolation, name: { it: Estensione del gomito, en: Elbow extension } }
  - { id: elbow_flexion,   region: upper, mechanics: isolation, name: { it: Flessione del gomito,  en: Elbow flexion } }
  - { id: knee_extension,  region: lower, mechanics: isolation, name: { it: Estensione del ginocchio, en: Knee extension } }
  - { id: knee_flexion,    region: lower, mechanics: isolation, name: { it: Flessione del ginocchio, en: Knee flexion } }
  - { id: calf_raise,      region: lower, mechanics: isolation, name: { it: Polpacci,           en: Calf raise } }
  # Aggiunti con il template a 5 giorni per spalle e glutei (vedi docs/eval-matrice.md). L'estensione
  # d'anca è un isolamento: si muove solo l'anca, il ginocchio resta fermo.
  - { id: lateral_raise,   region: upper, mechanics: isolation, name: { it: Alzate laterali,    en: Lateral raise } }
  - { id: rear_delt_fly,   region: upper, mechanics: isolation, name: { it: Deltoide posteriore, en: Rear delt fly } }
  - { id: hip_extension,   region: lower, mechanics: isolation, name: { it: Estensione d'anca,  en: Hip extension } }
  # Dalla KB 0.26.0. L'estensione della spalla a braccia tese (pullover) isola i dorsali; gli
  # altri sono i pattern dei distretti piccoli (addome, trapezi, abduttori, adduttori, avambracci).
  - { id: shoulder_extension, region: upper, mechanics: isolation, name: { it: Estensione della spalla, en: Shoulder extension } }
  - { id: trunk_flexion,      region: upper, mechanics: isolation, name: { it: Flessione del busto,     en: Trunk flexion } }
  - { id: scapular_elevation, region: upper, mechanics: isolation, name: { it: Elevazione delle scapole, en: Shrug } }
  - { id: hip_abduction,      region: lower, mechanics: isolation, name: { it: Abduzione dell'anca,     en: Hip abduction } }
  - { id: hip_adduction,      region: lower, mechanics: isolation, name: { it: Adduzione dell'anca,     en: Hip adduction } }
  - { id: forearm_isolation,  region: upper, mechanics: isolation, name: { it: Avambracci,              en: Forearms } }
  # Dalla KB 0.27.0, per il finisher dell'addome: tenere il busto fermo contro una forza che lo
  # estende (rollout) o che lo ruota (Pallof press).
  - { id: trunk_anti_extension, region: upper, mechanics: isolation, name: { it: Anti-estensione del busto, en: Trunk anti-extension } }
  - { id: trunk_anti_rotation,  region: upper, mechanics: isolation, name: { it: Anti-rotazione del busto,  en: Trunk anti-rotation } }
